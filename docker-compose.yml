services:
  app:
    image: infinite-canvas:v3.0.93
    container_name: infinite-canvas
    network_mode: host
    env_file:
      - /opt/infinite-canvas-secrets/tokaxis-canvas-proxy.env
      - /opt/infinite-canvas-secrets/canvas-auth.env
      - /opt/infinite-canvas-secrets/canvas-payment.env
    environment:
      PORT: "3100"
      TOKAXIS_INTERNAL_ORIGIN: "http://127.0.0.1:3000"
      PROMPT_CACHE_DIR: "/app/data/prompt-cache"
      TELEMETRY_DIR: "/app/data/telemetry"
      IMAGE_JOB_DIR: "/app/data/image-jobs"
      VIDEO_REFERENCE_DIR: "/app/data/video-references"
      AUTH_DATA_DIR: "/app/data/auth"
      CANVAS_AGENT_BILLING_WINDOW_SECONDS: "600"
      CANVAS_PUBLIC_ORIGIN: "https://gptimg.tokaxis.com"
    volumes:
      - /opt/infinite-canvas-data/prompt-cache:/app/data/prompt-cache
      - /opt/infinite-canvas-data/telemetry:/app/data/telemetry
      - /opt/infinite-canvas-data/image-jobs:/app/data/image-jobs
      - /opt/infinite-canvas-data/video-references:/app/data/video-references
      - /opt/infinite-canvas-data/auth:/app/data/auth
    restart: unless-stopped
