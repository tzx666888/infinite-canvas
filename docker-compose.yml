services:
  app:
    image: ${INFINITE_CANVAS_IMAGE:-ghcr.io/tzx666888/infinite-canvas:v3.157.40}
    container_name: infinite-canvas
    network_mode: host
    env_file:
      - /opt/infinite-canvas-secrets/tokaxis-canvas-proxy.env
      - /opt/infinite-canvas-secrets/canvas-auth.env
      - /opt/infinite-canvas-secrets/canvas-payment.env
    environment:
      PORT: "3100"
      HOSTNAME: "127.0.0.1"
      TOKAXIS_INTERNAL_ORIGIN: "http://127.0.0.1:3000"
      PROMPT_CACHE_DIR: "/app/data/prompt-cache"
      TELEMETRY_DIR: "/app/data/telemetry"
      IMAGE_JOB_DIR: "/app/data/image-jobs"
      VIDEO_REFERENCE_DIR: "/app/data/video-references"
      AUTH_DATA_DIR: "/app/data/auth"
      CANVAS_AGENT_BILLING_WINDOW_SECONDS: "600"
      CANVAS_PUBLIC_ORIGIN: "https://gptimg.tokaxis.com"
      CANVAS_MODEL_PRICES_JSON: '{"gpt-image-2":{"credits":2,"unit":"image"},"gpt-image-2.5-flare":{"credits":2,"unit":"image"},"gpt-image-2.5-sunburst":{"credits":2,"unit":"image"},"gemini-3.1-flash-image-4k":{"credits":2,"unit":"image"},"omni":{"credits":10,"unit":"request"},"omni_portrait":{"credits":10,"unit":"request"},"gpt-5.2":{"credits":1,"unit":"request"},"gpt-5.3-codex":{"credits":1,"unit":"request"},"gpt-5.3-codex-spark":{"credits":1,"unit":"request"},"gpt-5.4":{"credits":1,"unit":"request"},"gpt-5.4-mini":{"credits":1,"unit":"request"},"gpt-5.5":{"credits":1,"unit":"request"},"gpt-5.6-luna":{"credits":1,"unit":"request"},"gpt-5.6-sol":{"credits":1,"unit":"request"},"gpt-5.6-terra":{"credits":1,"unit":"request"},"gpt-6-astra":{"credits":1,"unit":"request"},"gemini-3.8-flash-high":{"credits":1,"unit":"request"},"gpt-4o-mini-tts":{"credits":1,"unit":"request"},"tts-1":{"credits":1,"unit":"request"},"doubao-seed-2-1-pro-260628":{"credits":1,"unit":"request"},"MiniMaxH3-720p":{"credits":25,"unit":"request","creditsBySeconds":{"10":25,"15":35}},"MiniMaxH3-2k":{"credits":30,"unit":"request","creditsBySeconds":{"10":30,"15":45}},"sd30":{"credits":60,"unit":"request"},"minimax-h3-720p":{"credits":25,"unit":"request"},"minimax-h3-1080p":{"credits":35,"unit":"request"},"minimax-h3-1080p-pro":{"credits":45,"unit":"request"},"sd30-720p":{"credits":60,"unit":"request"},"sd30-1080p":{"credits":100,"unit":"request"},"sd30-1080p-pro":{"credits":140,"unit":"request"},"omni-720p":{"credits":10,"unit":"request"},"omni-1080p":{"credits":25,"unit":"request"},"omni-1080p-pro":{"credits":35,"unit":"request"}}'
    volumes:
      - /opt/infinite-canvas-data/prompt-cache:/app/data/prompt-cache
      - /opt/infinite-canvas-data/telemetry:/app/data/telemetry
      - /opt/infinite-canvas-data/image-jobs:/app/data/image-jobs
      - /opt/infinite-canvas-data/video-references:/app/data/video-references
      - /opt/infinite-canvas-data/auth:/app/data/auth
    restart: unless-stopped
